MODEL:
  # Общие настройки модели
  backbone: dinov2
  size: small_reg
  pretrained: true
  return_cls_token: false # for transofrmers like Dinov2
  input_dims: 3
  output_dims: 0
  img_size: [518, 518]
  freeze_backbone: true

DATASET:
  # root: путь к датасету (для ImageFolder — папка с подпапками классов)
  root: metric_learning_data
  # num_classes: null — считать автоматически из датасета; иначе — использовать указанное значение
  num_classes: 4

TRAINER:
  # optimizer_type: AdamW | Adam | RAdam | NAdam | Adamax | SGD | RMSprop
  optimizer_type: AdamW
  # scheduler_type: cosine | cosine_with_warmup | steplr | multisteplr | reduceonplateau | exponential | none
  scheduler_type: cosine_with_warmup
  num_epochs: 200
  warmup_epochs: 5 # epochs для warmup (для cosine_with_warmup)
  lr: 1e-4
  weight_decay: 0.01
  batch_size: 32
  num_workers: 4
  shuffle: True
  train_proc: 0.75
  use_amp: true  # Automatic Mixed Precision (ускоряет обучение на GPU)
  train_mode: scratch # scratch, finetune, resume
  load_checkpoint: 'weights/best.pth'

# Параметры оптимизаторов
OPTIMIZER:
  # Для SGD
  momentum: 0.9
  nesterov: true
  # Для Adam/AdamW
  betas: [0.9, 0.999]
  eps: 1e-8
  amsgrad: false

# Параметры шедулеров
SCHEDULER:
  # StepLR
  step_size: 10
  gamma: 0.1
  # MultiStepLR
  milestones: [30, 60, 90]
  # ReduceLROnPlateau
  plateau_mode: min
  plateau_factor: 0.5
  plateau_patience: 7
  plateau_min_lr: 1e-7
  # ExponentialLR
  exp_gamma: 0.95
  # CosineAnnealingLR
  eta_min: 0
  # Warmup (для cosine_with_warmup)
  warmup_start_factor: 0.01


EARLY_STOPPING:
  # monitor: val_loss или имя scalar-метрики из секции METRICS, например accuracy / f1_weighted
  monitor: recall_at_1
  # mode: min для loss, max для accuracy/F1
  mode: max
  min_delta: 0.001 # минимальное улучшение monitor
  patience: 30
  save_path: weights/best_model.pth
  n_best_nets: 5
  soup_strategy: avg

# Метрики для валидации (укажите нужные в списке)
# Доступные: accuracy, precision_macro, precision_micro, precision_weighted,
#            recall_macro, recall_micro, recall_weighted,
#            f1_macro, f1_micro, f1_weighted, confusion_matrix
METRICS:
  enabled: true
  list:
    - accuracy
    #- precision_macro
    #- precision_micro
    - precision_weighted
    #- recall_macro
    #- recall_weighted
    #- recall_micro
    #- f1_macro
    #- f1_micro
    - f1_weighted
    - confusion_matrix
  # Имена классов для confusion matrix (порядок = индексы 0,1,2,...)
  class_names: ["metal", "ore", "wood", "trash"]

EMBEDDING_LOSS:
  # name: supcon | arc | center | arc_center | center_arc
  # arc_center = ArcLoss + center_weight * CenterLoss
  # center_arc = CenterLoss + arc_weight * ArcLoss
  name: supcon
  temperature: 0.07
  arc_s: 64.0
  arc_m: 0.5
  center_weight: 0.05
  arc_weight: 0.05
  balanced_batches: true
  classes_per_batch: 4
  samples_per_class: 4

EMBEDDING_METRICS:
  enabled: true
  plot_centroids_after_fit: true
  save_centroids_after_fit: true
